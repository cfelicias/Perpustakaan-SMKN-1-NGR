<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Perpustakaan SMKN 1 Negara</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="login-page">
    <div class="login-aside">
      <a href="index.html" class="logo">
        <img
          src="assets/images/smkna.png"
          alt=""
          class="logo"
          width="50"
          height="50"
        />
        <span>Perpustakaan SMKN 1 NEGARA</span>
      </a>

      <div class="shelf" aria-hidden="true">
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
        <span class="spine"></span>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <main class="login-container">
      <div class="login-card">
        <h1>LOGIN</h1>

        <p class="login-subtitle">Sistem Perpustakaan SMKN 1 Negara</p>

        <!-- TODO: change action to the login script when the backend is ready -->
        <form action="#" method="post">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-option">
            <label>
              <input type="checkbox" name="remember" />
              Remember Me
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="login-footer">
          <a href="index.html" class="back-link">Kembali Ke Beranda</a>
        </div>
      </div>
    </main>
  </body>
</html>
